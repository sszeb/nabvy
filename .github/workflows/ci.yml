# Pull request and main-branch checks (docs/operations.md, "CI/CD"). Still to come, each with the
# task that enables it: Vercel preview (0.5a), a migration dry-run against a real Supabase branch
# (needs a SUPABASE_ACCESS_TOKEN repository secret), and the deploy steps on merge (1.2, 0.5a; the
# coordinator applies merged migrations, packages/db/README.md).
#
# Runners (owner, 2026-09-24, 22:40): the repository is public until the production beta is about
# 90% built, so GitHub-hosted runners cost nothing and every job uses them. When the owner makes
# the repository private again, switch every `runs-on` below to `[self-hosted, linux, x64]` and
# install a runner from docs/ops/self-hosted-runner.md (never run a self-hosted runner for a
# public repository: a fork's pull request would execute on the machine).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  changed-files:
    name: Check changed files
    runs-on: ubuntu-24.04
    outputs:
      non-docs-changed: ${{ steps.changed.outputs.non-docs-changed }}
      full-run: ${{ steps.changed.outputs.full-run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # On push to main, run all checks, unscoped.
            echo "non-docs-changed=true" >> $GITHUB_OUTPUT
            echo "full-run=true" >> $GITHUB_OUTPUT
          else
            # On PR, check if any non-docs files changed
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
            # Consider non-docs if there's any change outside docs/*, *.md, *.txt, README*, CHANGELOG*
            if echo "$CHANGED" | grep -qv '^\(docs/\|.*\.md$\|.*\.txt$\|README\|CHANGELOG\)'; then
              echo "non-docs-changed=true" >> $GITHUB_OUTPUT
            else
              echo "non-docs-changed=false" >> $GITHUB_OUTPUT
            fi
            # turbo's --filter=...[origin/main] scopes typecheck/test to packages whose own
            # directory changed. An infra-only change (.github/, scripts/, or a root config file)
            # touches no package directory, so the filter matches zero packages and the scoped
            # run no-ops or errors instead of actually checking anything: fall back to an
            # unscoped, full run whenever no package directory is among the changed files.
            if echo "$CHANGED" | grep -q '^\(packages/\|services/\|apps/\|trigger/\)'; then
              echo "full-run=false" >> $GITHUB_OUTPUT
            else
              echo "full-run=true" >> $GITHUB_OUTPUT
            fi
          fi

  checks:
    name: Typecheck, lint and test
    needs: changed-files
    if: needs.changed-files.outputs.non-docs-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # corepack enable before setup-node's cache: pnpm, which shells out to `pnpm` itself to
      # resolve the store directory - without a pnpm shim on PATH yet, that step fails with
      # "Unable to locate executable file: pnpm" before any later step gets a chance to run.
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Restore .turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: turbo-
      - run: |
          if [ "${{ needs.changed-files.outputs.full-run }}" = "true" ]; then
            pnpm typecheck
          else
            pnpm typecheck --filter=...[origin/main]
          fi
      - run: pnpm lint
      - run: pnpm check:conventions
      - run: node --test scripts/check-conventions.test.mjs
      - run: |
          if [ "${{ needs.changed-files.outputs.full-run }}" = "true" ]; then
            pnpm test
          else
            pnpm test --filter=...[origin/main]
          fi
      # Fails when a module's stage falls below its recorded pass rate (fixtures/README.md).
      - run: pnpm test:fixtures

  audit:
    name: Dependency audit
    needs: changed-files
    if: needs.changed-files.outputs.non-docs-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the history (a pull request scans only its own commits; a push scans everything)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          RANGE=""
          if [ -n "$BASE_SHA" ]; then RANGE="--log-opts=$BASE_SHA..HEAD"; fi
          ./gitleaks git --no-banner --redact --exit-code 1 --config .gitleaks.toml $RANGE .

  migrations:
    name: Migration dry-run
    needs: changed-files
    if: needs.changed-files.outputs.non-docs-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Ensure psql is available
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      # The live project (Postgres 17) has pgvector and PostGIS; the stock image has neither, so
      # install them from the image's own PostgreSQL apt repository.
      - name: Install pgvector and PostGIS in the Postgres container
        run: >-
          docker exec ${{ job.services.postgres.id }} bash -c
          "apt-get update -qq && apt-get install -y -qq --no-install-recommends
          postgresql-17-pgvector postgresql-17-postgis-3"
      - run: bash scripts/db-dry-run.sh
      - name: withUser and RLS against the migrated database
        run: pnpm --filter @nabvy/db test
        env:
          DATABASE_URL: postgres://postgres:ci-only@localhost:5432/postgres
      # The magic-link quota under 20 simultaneous connections (PGlite in the checks job has one).
      - name: Auth rate-limit counter against the migrated database
        run: pnpm --filter @nabvy/auth test
        env:
          DATABASE_URL: postgres://postgres:ci-only@localhost:5432/postgres
      # The admin gate end to end (task 4.3af): 401 for nobody, 403 for a plain user, and the
      # production build refusing admin fixtures, over plain HTTP against the migrated database.
      - name: Admin gate end to end against the migrated database
        run: |
          pnpm --filter @nabvy/web build
          pnpm --filter @nabvy/web exec playwright test --project gate
        env:
          DATABASE_URL: postgres://postgres:ci-only@localhost:5432/postgres
      # Proves `pnpm new:module` end to end on a throwaway module that is never committed.
      - name: Scaffold a throwaway module end to end
        run: |
          pnpm new:module scaffold-probe
          pnpm install --prefer-offline --no-frozen-lockfile
          pnpm db:generate scaffold-probe --name scaffold_probe_schema
          pnpm typecheck
          pnpm lint
          pnpm --filter @nabvy/scaffold-probe --filter @nabvy/contracts --filter @nabvy/db test
          createdb scaffold_probe
          PGDATABASE=scaffold_probe bash scripts/db-dry-run.sh

# Reviewer/Fixer Routine firing does not live here: this workflow runs on `pull_request`, which
# for a same-repo branch executes the PR's own copy of the workflow file, so a job here can never
# safely hold REVIEW_FIRE_TOKEN/FIX_FIRE_TOKEN. That firing logic lives in
# .github/workflows/dispatch.yml instead, which only triggers off the default branch
# (workflow_run once this workflow finishes, push to main, and a 30-minute schedule) and reads
# this run's check-runs through the API rather than trusting its own job outcomes.
